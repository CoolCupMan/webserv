name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: "Optional extra app id suffix for a side-by-side install, e.g. .lab"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.WEBSERV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WEBSERV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No release keystore secret: release APK will be signed with the debug key."
          fi

      - name: Build debug and release APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WEBSERV_KEYSTORE_PASSWORD: ${{ secrets.WEBSERV_KEYSTORE_PASSWORD }}
          WEBSERV_KEY_ALIAS: ${{ secrets.WEBSERV_KEY_ALIAS }}
          WEBSERV_KEY_PASSWORD: ${{ secrets.WEBSERV_KEY_PASSWORD }}
          APP_ID_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ -n "$APP_ID_SUFFIX" ]; then EXTRA="-PappIdSuffix=$APP_ID_SUFFIX"; fi
          ./gradlew --no-daemon $EXTRA assembleDebug assembleRelease lintDebug

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: webserv-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webserv-apks-${{ github.run_number }}
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
