name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      app_id_suffix:
        description: "Optional extra app id suffix for a side-by-side install, e.g. .lab"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.WEBSERV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WEBSERV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No release keystore secret: release APK will be signed with the debug key."
          fi

      - name: Build debug and release APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WEBSERV_KEYSTORE_PASSWORD: ${{ secrets.WEBSERV_KEYSTORE_PASSWORD }}
          WEBSERV_KEY_ALIAS: ${{ secrets.WEBSERV_KEY_ALIAS }}
          WEBSERV_KEY_PASSWORD: ${{ secrets.WEBSERV_KEY_PASSWORD }}
          APP_ID_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ -n "$APP_ID_SUFFIX" ]; then EXTRA="-PappIdSuffix=$APP_ID_SUFFIX"; fi
          ./gradlew --no-daemon $EXTRA assembleDebug assembleRelease lintDebug

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: webserv-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Publishes every push (and v* tag) as a GitHub Release with direct .apk links.
  # Stable links to the newest build:
  #   https://github.com/<owner>/<repo>/releases/latest/download/WebServ.apk
  #   https://github.com/<owner>/<repo>/releases/latest/download/WebServ-debug.apk
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webserv-apks-${{ github.run_number }}
          path: apks

      - name: Prepare release files
        id: prep
        run: |
          . ./version.properties
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p out
          find apks -name '*.apk' -exec cp {} out/ \;
          cp out/*-release.apk out/WebServ.apk
          cp out/*-debug.apk out/WebServ-debug.apk
          ls -l out
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WebServ ${{ steps.prep.outputs.version }} (build ${{ github.run_number }})
          make_latest: "true"
          generate_release_notes: true
          body: |
            Direct downloads:
            - WebServ.apk — release build, app id `com.coolcupman.webserv`
            - WebServ-debug.apk — debug build, app id `com.coolcupman.webserv.debug` (installs side by side)

            Built from ${{ github.sha }} on ${{ github.ref_name }}.
          files: out/*.apk
